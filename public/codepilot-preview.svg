<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="691" viewBox="0 0 1200 691">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1025"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="691" fill="url(#bg)"/>

  <!-- Glow effect -->
  <ellipse cx="600" cy="350" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Terminal Window -->
  <rect x="80" y="60" width="1040" height="570" rx="16" fill="#0d0d14" stroke="#2a2a3e" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="80" y="60" width="1040" height="44" rx="16" fill="#16161f"/>
  <rect x="80" y="88" width="1040" height="16" fill="#16161f"/>

  <!-- Window dots -->
  <circle cx="110" cy="82" r="7" fill="#ff5f57"/>
  <circle cx="134" cy="82" r="7" fill="#febc2e"/>
  <circle cx="158" cy="82" r="7" fill="#28c840"/>

  <!-- Title text -->
  <text x="600" y="87" text-anchor="middle" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">codepilot — ~/projects</text>

  <!-- Terminal content -->
  <!-- Prompt line 1 -->
  <text x="110" y="140" fill="#06b6d4" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">❯</text>
  <text x="130" y="140" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="14">codepilot "Add authentication to the Express API"</text>

  <!-- Thinking indicator -->
  <text x="110" y="175" fill="#8b5cf6" font-family="JetBrains Mono, monospace" font-size="13">⟡</text>
  <text x="130" y="175" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="13">Analyzing codebase...</text>

  <!-- Plan output -->
  <text x="110" y="215" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">┌─ Plan ──────────────────────────────────────────────────────┐</text>
  <text x="110" y="240" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">│</text>
  <text x="130" y="240" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">1.</text>
  <text x="160" y="240" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="13">Install jsonwebtoken &amp; bcrypt dependencies</text>
  <text x="110" y="265" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">│</text>
  <text x="130" y="265" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">2.</text>
  <text x="160" y="265" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="13">Create auth middleware in src/middleware/auth.ts</text>
  <text x="110" y="290" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">│</text>
  <text x="130" y="290" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">3.</text>
  <text x="160" y="290" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="13">Add login &amp; register routes to src/routes/auth.ts</text>
  <text x="110" y="315" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">│</text>
  <text x="130" y="315" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">4.</text>
  <text x="160" y="315" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="13">Protect existing routes with JWT verification</text>
  <text x="110" y="340" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="13">└──────────────────────────────────────────────────────────────┘</text>

  <!-- File operations -->
  <text x="110" y="380" fill="#8b5cf6" font-family="JetBrains Mono, monospace" font-size="13">⟡</text>
  <text x="130" y="380" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="13">Writing files...</text>

  <text x="110" y="410" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">  ✓</text>
  <text x="145" y="410" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">Created</text>
  <text x="230" y="410" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="13">src/middleware/auth.ts</text>
  <text x="530" y="410" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">(+42 lines)</text>

  <text x="110" y="435" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">  ✓</text>
  <text x="145" y="435" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">Created</text>
  <text x="230" y="435" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="13">src/routes/auth.ts</text>
  <text x="510" y="435" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">(+67 lines)</text>

  <text x="110" y="460" fill="#eab308" font-family="JetBrains Mono, monospace" font-size="13">  ~</text>
  <text x="145" y="460" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">Modified</text>
  <text x="240" y="460" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="13">src/index.ts</text>
  <text x="420" y="460" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">(+8 -2 lines)</text>

  <text x="110" y="485" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="13">  ✓</text>
  <text x="145" y="485" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="13">Created</text>
  <text x="230" y="485" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="13">src/types/auth.ts</text>
  <text x="500" y="485" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">(+15 lines)</text>

  <!-- Status bar -->
  <rect x="80" y="520" width="1040" height="1" fill="#2a2a3e"/>

  <!-- Model info -->
  <text x="110" y="550" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">Model:</text>
  <text x="175" y="550" fill="#8b5cf6" font-family="JetBrains Mono, monospace" font-size="12">claude-sonnet-4</text>
  <text x="360" y="550" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">│</text>
  <text x="380" y="550" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">Files tracked:</text>
  <text x="510" y="550" fill="#06b6d4" font-family="JetBrains Mono, monospace" font-size="12">4</text>
  <text x="540" y="550" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">│</text>
  <text x="560" y="550" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="12">Tokens:</text>
  <text x="630" y="550" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">12.4k</text>

  <!-- Prompt -->
  <text x="110" y="590" fill="#06b6d4" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">❯</text>
  <rect x="130" y="578" width="2" height="18" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Branding -->
  <text x="870" y="550" fill="#64648a" font-family="JetBrains Mono, monospace" font-size="11">codepilot v0.4.4</text>
  <text x="1020" y="550" fill="#4a4a6a" font-family="JetBrains Mono, monospace" font-size="11">by yash</text>
</svg>
