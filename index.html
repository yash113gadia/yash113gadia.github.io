<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Signal-yellow "YG" tile in Bricolage Grotesque (letters as outlines, so no font needed). PNG first for browsers without SVG icons. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yash Gadia, full-stack engineer. Founding engineer at SpeedoExpress; built BiteSite, World Express Courier and Attestr. Live GPS tracking, multi-tenant SaaS and payments in production." />
    <meta name="author" content="Yash Gadia" />
    <meta property="og:title" content="Yash Gadia, full-stack engineer" />
    <meta property="og:description" content="Founding engineer at SpeedoExpress. Production systems for logistics, campuses and couriers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yashgadia.vercel.app" />
    <meta property="og:image" content="https://yashgadia.vercel.app/speedoexpress-preview.webp" />
    <meta name="theme-color" content="#0a0a09" />
    <title>Yash Gadia | Full-stack engineer</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        // Dark is the designed-for default; light is opt-in via the toggle.
        if (t !== 'light') t = 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
